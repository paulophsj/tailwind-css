<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TailwindCSS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="slide-06-main" class="min-h-dvh bg-(--background-light-gray-color) flex flex-col p-10 max-lg:p-8 max-md:p-5">
        <header class="z-100 mb-5 flex justify-between items-center w-full max-md:gap-4">
            <code class="text-(--dark-blue-text-color) font-bold tracking-widest text-sm max-md:text-xs">
                ESTADOS
            </code>
            <code class="text-(--dark-gray-text-color) text-sm max-md:text-xs">
                tailwind css
            </code>
        </header>
        <span class="z-100 w-full h-px bg-(--light-gray-text-color) mb-10 max-lg:mb-8 max-md:mb-6"></span>
        <section class="z-100 relative flex-1 flex flex-col gap-10 max-lg:gap-8 max-md:gap-6">
            <h1 class="font-bold text-5xl max-lg:text-4xl max-md:text-3xl">
                Dark mode é o mesmo prefixo
            </h1>
            <ul class="flex-1 grid grid-cols-2 gap-10 max-lg:gap-8 max-md:grid-cols-1 max-md:gap-4">
                <li class="flex flex-col justify-center gap-4 bg-white p-10 rounded-lg border border-gray-200 max-lg:p-8 max-md:p-6 max-md:gap-3">
                    <code class="text-(--light-gray-text-color) tracking-widest text-lg max-md:text-sm">TEMA CLARO</code>
                    <p class="font-bold text-3xl max-lg:text-2xl max-md:text-xl">Relatório mensal</p>
                    <code class="text-(--dark-gray-text-color) text-lg max-md:text-sm">bg-white text-slate-900</code>
                </li>
                <li class="flex flex-col justify-center gap-4 bg-(--background-gray-color) text-white p-10 rounded-lg max-lg:p-8 max-md:p-6 max-md:gap-3">
                    <code class="text-(--light-blue-text-color) tracking-widest text-lg max-md:text-sm">TEMA ESCURO</code>
                    <p class="font-bold text-3xl max-lg:text-2xl max-md:text-xl">Relatório mensal</p>
                    <code class="text-(--light-gray-text-color) text-lg max-md:text-sm">dark:bg-slate-900 dark:text-slate-100</code>
                </li>
            </ul>
            <code class="mb-10 text-(--dark-gray-text-color) text-xl max-lg:text-lg max-md:text-sm">
                hover: · focus: · disabled: · dark: a mesma gramática para qualquer estado.
            </code>
        </section>
    </main>
    <nav class="fixed z-500 bottom-10 left-10 right-10 flex justify-between text-white">
        <a href="./slide-05.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
            </svg>
        </a>
        <a href="./slide-07.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-right" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793L10.146 4.354a.5.5 0 1 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8"/>
            </svg>
        </a>
    </nav>

</html>
